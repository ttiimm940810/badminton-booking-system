<script>
/* ═══════════ 狀態 ═══════════ */
let selectedSize    = CONFIG.groupSizes[0].id;
let selectedSlots   = [];
let selectedPlanId  = CONFIG.plans[0].id;

/* ═══════════ 教練資料渲染 ═══════════ */
(function renderCoach() {
  const c = CONFIG.coach;
  document.getElementById('coach-avatar').src           = c.avatar;
  document.getElementById('coach-name').textContent     = c.name;
  document.getElementById('coach-title').textContent    = c.title;
  document.getElementById('coach-bio').textContent      = c.bio;
  const tagsEl = document.getElementById('coach-tags');
  c.tags.forEach(t => {
    const s = document.createElement('span');
    s.className   = 'text-xs px-2.5 py-1 rounded-full bg-brand-50 text-brand-500 border border-brand-200 font-medium';
    s.textContent = t;
    tagsEl.appendChild(s);
  });
})();

/* ═══════════ 人數卡片 ═══════════ */
(function renderSizes() {
  const grid = document.getElementById('size-grid');
  CONFIG.groupSizes.forEach(sz => {
    const div = document.createElement('div');
    div.id        = `size-${sz.id}`;
    div.className = `size-card p-3 text-center rounded-xl border-2 text-xs font-bold transition-all
                     ${sz.id === selectedSize
                       ? 'border-brand-500 bg-brand-50 text-brand-600'
                       : 'border-warm-200 bg-warm-50 text-warm-500'}`;
    div.innerHTML = sz.label;
    div.addEventListener('click', () => setSize(sz.id));
    grid.appendChild(div);
  });
})();

function setSize(id) {
  selectedSize = id;
  CONFIG.groupSizes.forEach(sz => {
    const el = document.getElementById(`size-${sz.id}`);
    el.className = el.className
      .replace(/border-brand-500 bg-brand-50 text-brand-600|border-warm-200 bg-warm-50 text-warm-500/g, '').trim();
    el.classList.add(...(sz.id === id
      ? ['border-brand-500','bg-brand-50','text-brand-600']
      : ['border-warm-200','bg-warm-50','text-warm-500']));
  });
  document.getElementById('team-note').classList.toggle('hidden', id !== '1on4');
  selectedSlots = [];
  renderSlotStates();
  updatePricing();
}

/* ═══════════ 日期設定 ═══════════ */
(function initDate() {
  const inp  = document.getElementById('input-date');
  const today = new Date();
  const min   = new Date(today);
  min.setDate(today.getDate() + CONFIG.bookingLeadDays);
  const max   = new Date(today);
  max.setDate(today.getDate() + CONFIG.maxAdvanceDays);
  const fmt = d => d.toISOString().split('T')[0];
  inp.min   = fmt(min);
  inp.max   = fmt(max);
  inp.value = fmt(min);
  inp.addEventListener('change', onDateChange);
  setTimeout(onDateChange, 500);
})();

/* ═══════════ 時段按鈕渲染 ═══════════ */
(function renderSlots() {
  const grid = document.getElementById('slots-grid');
  CONFIG.slots.forEach(slot => {
    const btn = document.createElement('button');
    btn.type      = 'button';
    btn.dataset.value = slot.value;
    btn.dataset.fee   = slot.fee;
    btn.dataset.idx   = CONFIG.slots.indexOf(slot);
    btn.className = `slot-btn text-[11px] font-bold py-2 px-1 rounded-lg border
                     ${slot.night ? 'night-slot' : 'day-slot'}`;
    btn.textContent = slot.label;
    btn.addEventListener('click', () => toggleSlot(btn));
    grid.appendChild(btn);
  });
})();

function renderSlotStates() {
  document.querySelectorAll('.slot-btn').forEach(btn => {
    btn.classList.toggle('selected', selectedSlots.includes(btn.dataset.value));
  });
}

function toggleSlot(btn) {
  if (btn.disabled) return;
  const val = btn.dataset.value;
  const idx = parseInt(btn.dataset.idx);

  if (selectedSize === '1on4') {
    if (selectedSlots.includes(val)) {
      selectedSlots = selectedSlots.filter(v => v !== val);
    } else {
      if (selectedSlots.length >= 2) selectedSlots = [];
      selectedSlots.push(val);
      if (selectedSlots.length === 2) {
        const idxs = selectedSlots.map(v => {
          const s = CONFIG.slots.find(s => s.value === v);
          return CONFIG.slots.indexOf(s);
        }).sort((a,b) => a-b);
        if (idxs[1] - idxs[0] !== 1) {
          alert('4 人團班時段必須連續！請重新選擇。');
          selectedSlots = [val];
        }
      }
    }
  } else {
    if (selectedSlots.includes(val)) {
      selectedSlots = selectedSlots.filter(v => v !== val);
    } else {
      selectedSlots.push(val);
    }
  }
  renderSlotStates();
  updatePricing();
}

/* ═══════════ 日期變更：查詢已被預約時段 ═══════════ */
function onDateChange() {
  const date = document.getElementById('input-date').value;
  if (!date) return;

  document.querySelectorAll('.slot-btn').forEach(btn => {
    btn.disabled = false;
    const slot = CONFIG.slots.find(s => s.value === btn.dataset.value);
    if (slot) btn.textContent = slot.label;
  });

  fetch(`${CONFIG.apiUrl}?date=${date}`)
    .then(r => r.json())
    .then(booked => {
      if (!Array.isArray(booked)) return;
      document.querySelectorAll('.slot-btn').forEach(btn => {
        const isBooked = booked.includes(btn.dataset.value);
        btn.disabled = isBooked;
        if (isBooked) {
          btn.textContent = '已預約';
          selectedSlots = selectedSlots.filter(v => v !== btn.dataset.value);
        }
      });
      renderSlotStates();
      updatePricing();
    })
    .catch(() => {});
}

/* ═══════════ 方案渲染 & 定價計算 ═══════════ */
(function renderPlans() {
  const list = document.getElementById('plans-list');
  CONFIG.plans.forEach(plan => {
    const div = document.createElement('div');
    div.id        = `plan-${plan.id}`;
    div.className = `plan-card p-4 rounded-xl border-2 border-warm-200 bg-warm-50 flex justify-between items-center`;
    div.innerHTML = `
      <div>
        <p class="text-sm font-semibold text-warm-600">${plan.label}</p>
        ${plan.note ? `<p class="text-[10px] text-warm-400 mt-0.5">${plan.note}</p>` : ''}
      </div>
      <span id="price-${plan.id}" class="text-brand-500 font-bold text-sm whitespace-nowrap ml-3">-- /人</span>
    `;
    div.addEventListener('click', () => selectPlan(plan.id));
    list.appendChild(div);
  });
  selectPlan(selectedPlanId);
})();

function selectPlan(id) {
  selectedPlanId = id;
  CONFIG.plans.forEach(p => {
    const el = document.getElementById(`plan-${p.id}`);
    el.classList.toggle('selected', p.id === id);
    if (!el.classList.contains('selected')) {
      el.classList.remove('border-brand-500');
      el.classList.add('border-warm-200');
    }
  });
}

function updatePricing() {
  if (selectedSlots.length === 0) {
    CONFIG.plans.forEach(p => {
      document.getElementById(`price-${p.id}`).textContent = '-- /人';
    });
    return;
  }

  const size  = selectedSize;
  const slots = selectedSlots.map(v => CONFIG.slots.find(s => s.value === v));

  if (size === '1on4') {
    const p = CONFIG.pricing['1on4'];
    document.getElementById('price-trial').textContent  = `$${p.trial} /人`;
    document.getElementById('price-single').textContent = `$${p.single} /人`;
    document.getElementById('price-ten').textContent    = `$${p.ten} /人`;
    return;
  }

  if (size === '1on2') {
    let trial=0, single=0, ten=0;
    slots.forEach(s => {
      const r = CONFIG.pricing['1on2'].byFee[s.fee];
      trial  += r.trial;
      single += r.single;
      ten    += r.ten;
    });
    document.getElementById('price-trial').textContent  = `$${trial} /人`;
    document.getElementById('price-single').textContent = `$${single} /人`;
    document.getElementById('price-ten').textContent    = `$${ten} /人`;
    return;
  }

  const p   = CONFIG.pricing['1on1'];
  const hrs = slots.length;
  const venueTotal = slots.reduce((sum, s) => sum + s.fee, 0);
  document.getElementById('price-trial').textContent  = `$${p.trial  * hrs + venueTotal} /人`;
  document.getElementById('price-single').textContent = `$${p.single * hrs + venueTotal} /人`;
  document.getElementById('price-ten').textContent    = `$${p.ten    * hrs + venueTotal * 10} /人`;
}

/* ═══════════ 球館選單 ═══════════ */
(function renderVenues() {
  const sel = document.getElementById('input-venue');
  CONFIG.venues.forEach(v => {
    const opt  = document.createElement('option');
    opt.value  = v;
    opt.text   = v;
    sel.appendChild(opt);
  });
  const other = document.createElement('option');
  other.value = '其他';
  other.text  = '其他（請填寫）';
  sel.appendChild(other);

  sel.addEventListener('change', () => {
    document.getElementById('venue-other-wrap')
      .classList.toggle('hidden', sel.value !== '其他');
  });
})();

/* ═══════════ 附加服務 ═══════════ */
(function renderAddons() {
  const grid = document.getElementById('addons-grid');
  CONFIG.addons.forEach(a => {
    const label = document.createElement('label');
    label.className = 'flex items-center gap-2 p-3 bg-warm-50 rounded-xl cursor-pointer border-2 border-transparent hover:border-warm-200 transition-all';
    label.innerHTML = `
      <input type="checkbox" value="${a.value}" class="addon-check w-4 h-4 rounded" />
      <span class="text-xs font-semibold text-warm-500">${a.label}</span>
    `;
    grid.appendChild(label);
  });
})();

/* ═══════════ 電話驗證 ═══════════ */
document.getElementById('input-phone').addEventListener('input', function() {
  document.getElementById('phone-error')
    .classList.toggle('hidden', this.value.length === 0 || /^09\d{8}$/.test(this.value));
});

/* ═══════════ 確認預約 → 開 Modal ═══════════ */
document.getElementById('btn-book').addEventListener('click', () => {
  const name  = document.getElementById('input-name').value.trim();
  const phone = document.getElementById('input-phone').value.trim();
  const lineID= document.getElementById('input-line').value.trim();
  const date  = document.getElementById('input-date').value;
  const venue = document.getElementById('input-venue').value;

  if (!name)                        { alert('請填寫姓名');   return; }
  if (!/^09\d{8}$/.test(phone))     { alert('請輸入正確手機號碼'); return; }
  if (!lineID)                      { alert('請填寫 LINE ID'); return; }
  if (!date)                        { alert('請選擇日期');   return; }
  if (selectedSlots.length === 0)   { alert('請選擇時段');   return; }
  if (selectedSize === '1on4' && selectedSlots.length !== 2) { alert('4 人團班請選連續 2 個時段'); return; }
  if (!venue)                       { alert('請選擇球館');   return; }
  if (venue === '其他' && !document.getElementById('input-venue-other').value.trim()) {
    alert('請填寫球館名稱'); return;
  }

  const planEl = document.getElementById(`price-${selectedPlanId}`);
  const priceText = planEl ? planEl.textContent : '--';

  document.getElementById('modal-name').textContent     = name;
  document.getElementById('modal-size').textContent     = CONFIG.groupSizes.find(s => s.id === selectedSize).label;
  document.getElementById('modal-datetime').textContent = `${date}　${selectedSlots.join('、')}`;
  document.getElementById('modal-plan').textContent     = CONFIG.plans.find(p => p.id === selectedPlanId).label;
  document.getElementById('modal-price').textContent    = priceText;

  document.getElementById('modal-success').classList.add('hidden');
  document.getElementById('btn-submit').classList.remove('hidden');
  document.getElementById('btn-submit-text').textContent = '送出預約';
  document.getElementById('btn-submit').disabled = false;

  openModal();
});

/* ═══════════ Modal 控制 ═══════════ */
function openModal() {
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
}
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

/* ═══════════ 送出預約 ═══════════ */
document.getElementById('btn-submit').addEventListener('click', async () => {
  const venueVal   = document.getElementById('input-venue').value;
  const venueOther = document.getElementById('input-venue-other').value.trim();
  const addons     = Array.from(document.querySelectorAll('.addon-check:checked')).map(c => c.value).join(', ');
  const planEl     = document.getElementById(`price-${selectedPlanId}`);

  const payload = {
    name:             document.getElementById('input-name').value.trim(),
    phone:            document.getElementById('input-phone').value.trim(),
    lineID:           document.getElementById('input-line').value.trim(),
    date:             document.getElementById('input-date').value,
    timeSlot:         selectedSlots.join(', '),
    groupSize:        selectedSize,
    coursePlan:       CONFIG.plans.find(p => p.id === selectedPlanId).label.replace(/🔹 /,''),
    pricePerPerson:   planEl ? planEl.textContent : '',
    venue:            venueVal === '其他' ? venueOther : venueVal,
    services:         addons,
    note:             document.getElementById('input-note').value.trim(),
    transferLast5:    '',
    coachName:           CONFIG.coach.name,
    coachLineUserId:     CONFIG.coach.lineUserId,
    developerLineUserId: CONFIG.coach.developerLineUserId,
    secret_key:       CONFIG.secretKey,
    timestamp:        new Date().toISOString(),
  };

  const btn     = document.getElementById('btn-submit');
  const btnText = document.getElementById('btn-submit-text');
  btn.disabled  = true;
  btnText.textContent = '資料傳送中…';

  try {
    await fetch(CONFIG.apiUrl, {
      method: 'POST',
      mode:   'no-cors',
      body:   JSON.stringify(payload),
    });

    btn.classList.add('hidden');
    document.getElementById('modal-success').classList.remove('hidden');
    setTimeout(() => {
      closeModal();
      selectedSlots = [];
      renderSlotStates();
      updatePricing();
    }, 3000);

  } catch (err) {
    console.error(err);
    alert('送出失敗，請稍後再試。');
    btn.disabled  = false;
    btnText.textContent = '送出預約';
  }
});
</script>
